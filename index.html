<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Pack Protection Prototypes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
:root{--bg:#F4F6F2;--card:#FFFFFF;--ink:#16211D;--muted:#4A5953;--line:#D3DBD5;--brand:#1F5C4A;--brand-ink:#FFFFFF;--amber:#E8A33D;--shadow:rgba(22,33,29,.07)}
@media (prefers-color-scheme: dark){:root{--bg:#101714;--card:#18221E;--ink:#EEF3EF;--muted:#A9B8B1;--line:#2C3A34;--brand:#5FBF98;--brand-ink:#0C1512;--amber:#F0B65A;--shadow:rgba(0,0,0,.35);color-scheme:dark}}
body{background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:17px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:48px}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.logo{display:flex;align-items:center;gap:12px;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:1.8rem;color:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
a.card{display:flex;flex-direction:column;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:24px;text-decoration:none;color:inherit;box-shadow:0 6px 18px var(--shadow);transition:transform .15s,border-color .15s}
a.card:hover{transform:translateY(-3px);border-color:var(--brand)}
a.card:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.letter{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:3rem;line-height:1;color:var(--brand)}
.name{font-weight:700;font-size:1.15rem}
.go{color:var(--brand);font-weight:700;margin-top:auto}
</style>
</head>
<body>
<div class="wrap">
<div class="logo"><svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3 5 9v10c0 9 6.5 15.5 15 18 8.5-2.5 15-9 15-18V9L20 3z" fill="currentColor"/></svg>Pack Protection</div>
<div class="grid">
<a class="card" href="a/"><span class="letter">A</span><span class="name">Check It</span><span class="go">Open &rsaquo;</span></a>
<a class="card" href="b/"><span class="letter">B</span><span class="name">Family Circle</span><span class="go">Open &rsaquo;</span></a>
<a class="card" href="c/"><span class="letter">C</span><span class="name">Facility Console</span><span class="go">Open &rsaquo;</span></a>
</div>
</div>
</body>
</html>
